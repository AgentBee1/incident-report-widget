<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Award review queue — AgentBee</title>
<style>
  :root { --ink:#1a1d23; --muted:#6b7280; --line:#e5e7eb; --blue:#1d4ed8; --green:#15803d; --red:#b91c1c; --amber:#92400e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background:#f6f7f9; color:var(--ink); font-size:14px; }
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { margin:0; font-size:22px; }
  a { color: var(--blue); }
  .muted { color: var(--muted); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:16px; display:grid; grid-template-columns: 1fr 1fr; overflow:hidden; }
  .card .left { padding:18px; border-right:1px solid var(--line); }
  .card .right { padding:18px; background:#fafbfc; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:12px; }
  label { display:block; font-size:12px; font-weight:600; color:#374151; margin:10px 0 4px; }
  input[type=text], input[type=date], input[type=url], select { width:100%; padding:8px 10px; border:1px solid #d1d5db; border-radius:8px; font:inherit; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .check { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:13px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; align-items:center; }
  button { font:inherit; font-weight:600; border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid transparent; }
  .approve { background:var(--green); color:#fff; }
  .reject { background:#fff; color:var(--red); border-color:#fecaca; }
  button:disabled { opacity:.6; cursor:default; }
  .others { margin-top:14px; font-size:12px; }
  .others div { padding:3px 0; border-top:1px solid #f3f4f6; }
  .warn { color:#b45309; font-size:12px; margin-top:10px; }
  .result { margin-top:10px; font-size:13px; }
  iframe { width:100%; border:0; background:#fff; border-radius:8px; }
  .empty { text-align:center; padding:60px 16px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:12px; }
  @media (max-width: 800px) { .card { grid-template-columns: 1fr; } .card .left { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>Award review queue</h1>
      <div class="muted" id="summary">Loading…</div>
    </div>
    <div><a href="/">← Back to widget</a> · <a href="/awards.html">All awards</a></div>
  </div>
  <div id="list"></div>
</div>

<script>
const SUPABASE_URL = 'https://mtatzzrbapftzwuxrcko.supabase.co';
const KEY = sessionStorage.getItem('ab-supabase-key') || '';
if (sessionStorage.getItem('ab-admin-auth') !== 'true' || sessionStorage.getItem('ab-role') !== 'admin') {
  document.getElementById('list').innerHTML = '<div class="empty">The review queue is for the admin login only. <a href="/">Log in</a></div>';
  document.getElementById('summary').textContent = '';
  throw new Error('not admin');
}
const sb = (path) => fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } }).then(r => r.json());
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Official embeds, same rules as the Kudos site.
function embedSrc(url) {
  try {
    const u = new URL(url); const h = u.hostname.replace(/^www\./, '');
    if (h.endsWith('linkedin.com')) {
      const m = url.match(/(activity|ugcPost|share)[-:](\d{15,})/);
      return m ? `https://www.linkedin.com/embed/feed/update/urn:li:${m[1]}:${m[2]}` : null;
    }
    if (h.endsWith('instagram.com')) {
      const m = url.match(/instagram\.com\/(p|reel)\/([A-Za-z0-9_-]+)/);
      return m ? `https://www.instagram.com/${m[1]}/${m[2]}/embed/captioned/` : null;
    }
    if (h.endsWith('facebook.com')) return `https://www.facebook.com/plugins/post.php?href=${encodeURIComponent(url)}&show_text=true&width=500`;
  } catch {}
  return null;
}

async function load() {
  const pending = await sb('incidents?review_status=eq.pending&select=id,agent_id,award_title,incident_date,original_source_url,issuing_institution_id,notify_agent,submitted_by,created_at&order=created_at.asc');
  document.getElementById('summary').textContent = pending.length
    ? `${pending.length} award${pending.length === 1 ? '' : 's'} waiting for review`
    : '';
  if (!pending.length) {
    document.getElementById('list').innerHTML = '<div class="empty">🎉 Nothing waiting for review.</div>';
    return;
  }
  const agentIds = [...new Set(pending.map(p => p.agent_id))];
  const agents = await sb(`agents?id=in.(${agentIds.join(',')})&select=id,agency_name,email,canonical_agent_id`);
  const canonIds = [...new Set(agents.map(a => a.canonical_agent_id || a.id))];
  const canon = await sb(`agents?id=in.(${canonIds.join(',')})&select=id,agency_name,email`);
  const group = await sb(`agents?or=(id.in.(${canonIds.join(',')}),canonical_agent_id.in.(${canonIds.join(',')}))&select=id,canonical_agent_id`);
  const groupIds = group.map(g => g.id);
  const others = await sb(`incidents?agent_id=in.(${groupIds.join(',')})&award_title=not.is.null&review_status=neq.pending&select=agent_id,award_title,incident_date,review_status,issuing_institution_id&order=incident_date.desc`);
  const instIds = [...new Set([...pending, ...others].map(x => x.issuing_institution_id).filter(Boolean))];
  const insts = instIds.length ? await sb(`institutions?id=in.(${instIds.join(',')})&select=id,name`) : [];
  const instName = Object.fromEntries(insts.map(i => [i.id, i.name]));
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));
  const canonById = Object.fromEntries(canon.map(a => [a.id, a]));
  const groupOf = Object.fromEntries(group.map(g => [g.id, g.canonical_agent_id || g.id]));

  document.getElementById('list').innerHTML = pending.map(p => {
    const a = agentById[p.agent_id] || {};
    const c = canonById[a.canonical_agent_id || a.id] || a;
    const email = a.email || c.email;
    const mine = others.filter(o => groupOf[o.agent_id] === (a.canonical_agent_id || a.id));
    const similar = mine.filter(o => o.issuing_institution_id === p.issuing_institution_id);
    const src = embedSrc(p.original_source_url);
    return `
    <div class="card" id="card-${p.id}">
      <div class="left">
        <div class="meta">Submitted by <strong>${esc(p.submitted_by || 'unknown')}</strong> · ${new Date(p.created_at).toLocaleString('en-AU')}</div>
        <div style="font-size:16px;font-weight:700;">${esc(c.agency_name || a.agency_name)}</div>
        ${a.canonical_agent_id ? `<div class="muted" style="font-size:12px;">Entered against branch record "${esc(a.agency_name)}"</div>` : ''}
        <div class="muted" style="margin-top:2px;">Issued by <strong>${esc(instName[p.issuing_institution_id] || '—')}</strong></div>
        <label>Award title</label>
        <input type="text" data-f="award_title" value="${esc(p.award_title)}" />
        <div class="row">
          <div><label>Date</label><input type="date" data-f="incident_date" value="${esc(p.incident_date)}" /></div>
        </div>
        <label>Original announcement link</label>
        <input type="url" data-f="original_source_url" value="${esc(p.original_source_url)}" />
        <label class="check"><input type="checkbox" data-f="notify_agent" ${p.notify_agent ? 'checked' : ''} ${email ? '' : 'disabled'} />
          Email the agent when approved ${email ? `(${esc(email)})` : '<span class="muted">(no email on file)</span>'}</label>
        ${similar.length ? `<div class="warn">⚠️ Possible duplicate: this agent already has ${similar.map(o => `"${esc(o.award_title)}" (${esc(o.incident_date || 'no date')}, ${esc(o.review_status === 'approved' ? 'live' : o.review_status)})`).join(', ')} from the same issuer.</div>` : ''}
        <div class="others"><strong>Other awards for this agent (${mine.length})</strong>
          ${mine.length ? mine.map(o => `<div>${esc(o.award_title)} · ${esc(instName[o.issuing_institution_id] || '')} · ${esc(o.incident_date || '')} · ${o.review_status === 'approved' ? 'live' : esc(o.review_status)}</div>`).join('') : '<div class="muted">None</div>'}
        </div>
        <div class="actions">
          <button class="approve" onclick="act('${p.id}','approve',this)">✓ Approve &amp; publish</button>
          <select data-reason style="width:auto;flex:0 0 auto;">
            <option>Duplicate</option><option>Wrong agent</option><option>Not an award</option><option>Can't verify the source</option><option>Other</option>
          </select>
          <button class="reject" onclick="act('${p.id}','reject',this)">✕ Reject</button>
        </div>
        <div class="result" id="res-${p.id}"></div>
      </div>
      <div class="right">
        <div style="font-size:12px;font-weight:600;margin-bottom:8px;">Source</div>
        ${src ? `<iframe src="${esc(src)}" height="560" loading="lazy"></iframe>` : ''}
        <div style="margin-top:8px;font-size:12px;">${p.original_source_url ? `<a href="${esc(p.original_source_url)}" target="_blank" rel="noopener">Open the original post ↗</a>` : '<span class="warn">No source link entered.</span>'}</div>
      </div>
    </div>`;
  }).join('');
}

async function act(id, action, btn) {
  const card = document.getElementById(`card-${id}`);
  const res = document.getElementById(`res-${id}`);
  const body = { action, incident_id: id, reviewer: sessionStorage.getItem('ab-name') || 'Admin' };
  if (action === 'approve') {
    body.edits = {};
    card.querySelectorAll('[data-f]').forEach(el => {
      body.edits[el.dataset.f] = el.type === 'checkbox' ? el.checked : (el.value.trim() || null);
    });
  } else {
    if (!confirm('Reject this award? It will not be published.')) return;
    body.reason = card.querySelector('[data-reason]').value;
  }
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  res.textContent = action === 'approve' ? 'Publishing…' : 'Rejecting…';
  try {
    const r = await fetch('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session': sessionStorage.getItem('ab-session') || '' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || r.statusText);
    if (action === 'reject') {
      res.innerHTML = '<span style="color:#b91c1c;">Rejected.</span>';
    } else {
      res.innerHTML = `<span style="color:#15803d;">✓ Published.</span>
        ${d.kudosUrl ? ` Kudos: <a href="${esc(d.kudosUrl)}" target="_blank">${esc(d.kudosUrl)}</a> <button onclick="navigator.clipboard.writeText('${esc(d.kudosUrl)}');this.textContent='Copied ✓'" style="padding:2px 8px;font-size:12px;">Copy</button>` : ''}
        ${d.circleUrl ? `<br>Circle post: <a href="${esc(d.circleUrl)}" target="_blank">${esc(d.circleUrl)}</a>` : ''}
        ${d.circleError ? `<br><span style="color:#b91c1c;">⚠️ Circle post not created: ${esc(d.circleError)}</span>` : ''}`;
    }
    card.style.opacity = '0.75';
  } catch (e) {
    res.innerHTML = `<span style="color:#b91c1c;">⚠️ ${esc(e.message)}</span>`;
    card.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

load().catch(e => { document.getElementById('list').innerHTML = `<div class="empty">Couldn't load the queue: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
